name: Documentation
description: ドキュメントの誤りを見つけた場合は、こちらから報告してください。
labels: ["type: documentation"]
body:
  - type: markdown
    attributes:
      value: |
        # ドキュメントの報告

        このリポジトリにある文書（`README.md`、`CLAUDE.md`、各パッケージの `README.md`、`docs/` など）の誤りを受け付けます。
        下の各項目を記入してください。

        公式サイト（gatsbyjs.com）のドキュメントは本家のものです。公式サイトの誤りは、本家へ報告してください。

        参考リンク:

        - 開発ルール: https://github.com/linkohta/gatsby_to/blob/master/CLAUDE.md
  - type: checkboxes
    attributes:
      label: 事前の確認
      description: それぞれの項目を確認してから、チェックを入れてください。
      options:
        - label: "同じ内容の Issue がないことを確認しました: https://github.com/linkohta/gatsby_to/issues"
          required: true
        - label: "これは質問や機能の要望ではなく、このリポジトリにある文書の誤りの報告です。"
          required: true
  - type: textarea
    validations:
      required: true
    attributes:
      label: 概要
      description: |
        どの文書のどの記述に、どのような問題がありましたか。実際の動作やコードと食い違っている場合は、その内容も書いてください。
  - type: textarea
    validations:
      required: true
    attributes:
      label: 解決に必要な作業
      description: どう直せばよいですか。ほかに更新が必要な文書はありますか。
      value: |
        1.
        2.
        3.
        ...

name: Bug Report
description: 期待どおりに動かない場合は、こちらからバグを報告してください。
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        # バグ報告

        このリポジトリは [gatsbyjs/gatsby](https://github.com/gatsbyjs/gatsby) のフォークです。ここでは、このリポジトリのコードで起きる問題を受け付けます。
        下の各項目を記入してください。再現手順がはっきりしていると、原因の調査と修正が早く進みます。

        npm に公開されている本家の Gatsby だけで起きる問題は、本家へ報告してください。

        参考リンク:
        - ドキュメント（本家、英語）: https://www.gatsbyjs.com/docs/
        - 開発ルール: https://github.com/linkohta/gatsby_to/blob/master/CLAUDE.md
  - type: checkboxes
    attributes:
      label: 事前の確認
      description: それぞれの項目を確認してから、チェックを入れてください。
      options:
        - label: "同じ内容の Issue がないことを確認しました: https://github.com/linkohta/gatsby_to/issues"
          required: true
        - label: "これは質問や機能の要望ではなく、このリポジトリのコードに直接関係するバグの報告です。"
          required: true
  - type: textarea
    attributes:
      label: 説明
      description: 起きている問題を説明してください。
      placeholder: できるだけ具体的に書いてください。スクリーンショット、動画、ブラウザーの開発者ツールの情報も歓迎します。
    validations:
      required: true
  - type: input
    id: reproduction-link
    attributes:
      label: 再現用のリンク
      placeholder: "https://github.com/username/repository-name/"
      description: |
        最小限の再現用プロジェクト（GitHub のリポジトリなど）へのリンクです。

        **実際のプロジェクトではなく**、新しく作った最小限のプロジェクトで再現させてください。作り方（本家、英語）: https://gatsby.dev/reproduction

        このリポジトリのパッケージをサイトで使うには、`gatsby-dev-cli` でローカルのビルドをコピーします: https://github.com/linkohta/gatsby_to/tree/master/packages/gatsby-dev-cli
    validations:
      required: true
  - type: textarea
    attributes:
      label: 再現手順
      description: 問題を再現する手順を、順番に書いてください。
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期待する結果
      description: どうなることを期待していたかを書いてください。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 実際の結果
      description: 実際に何が起きたかを書いてください。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 環境
      render: shell
      description: プロジェクトのディレクトリで "gatsby info --clipboard" を実行し、出力を貼り付けてください。
      placeholder: |
        次のような出力が得られます:

        System:
          OS: Operating System
          CPU: CPU
        Binaries:
          Node: X
          npm: X
        Languages:
          Python: X
        Browsers:
          Chrome: X
          Edge: X
        npmPackages:
          gatsby: X => X
    validations:
      required: true
  - type: textarea
    attributes:
      label: 設定のフラグ
      description: 設定ファイル（gatsby-config）で flags を使っている場合は、ここに貼り付けてください。
      placeholder: |
        例:

        DEV_SSR: true
        FAST_DEV: false
    validations:
      required: false
